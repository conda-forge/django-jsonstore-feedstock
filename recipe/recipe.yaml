# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: django-jsonstore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-jsonstore/django_jsonstore-${{ version }}.tar.gz
  sha256: d9663e1dff61ca9c8c1935d089d9c161e8f4cd897f5e71dc2682a9697046cbcc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=5.2
tests:
  - python:
      imports:
        - jsonstore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: http://github.com/viewflow/jsonstore
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Expose JSONField data as a virtual django model fields.
  description: |
    Expose JSONField data as a virtual django model fields.

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
